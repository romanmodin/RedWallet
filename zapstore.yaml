description: |
  RedWallet is an early Android beta for Bitcoin (XBT), based on BlueWallet.
  Create or restore BIP39 Native SegWit or BIP86 Taproot wallets, send and receive with QR codes,
  view wallet history, and connect to your own Fulcrum server.
  Authenticated TLS supports explicitly trusted private-server certificates.
  Supported spends use SIGHASH_UNIFIED (0x21). XBT watch-only accounts can
  prepare PSBT requests for compatible external signers; physical cold-wallet
  interoperability still needs testing.
  USDC estimates use a manual quote or optional NeoxEX pricing.
  Password-encrypted storage, decoy wallets, authenticated secret exports,
  and fee/recipient confirmations are supported.
  This beta passed automated and Android emulator checks. The maintainer does
  not own an Android phone and has not personally tested this Android build.
  Begin with an empty disposable wallet and retain an offline recovery backup.
  Do not downgrade after upgrading encrypted storage.
  Taproot key-path spending and opt-in BIP86 watch-only signed-PSBT returns
  require an XBT Unified-capable signer. RBF preserves recipients and inputs,
  funding higher fees from sufficient change. CPFP prices one unconfirmed parent
  plus child. Return a signed PSBT; raw signed hex is unsupported. Requests bind
  the current app session; after restart, create and sign a fresh request.
  The on-chain send and cold-signing flows do not support Taproot script paths, annexes, multisig, RBF cancellation or added inputs.
  Physical cold-device and funded physical-phone interoperability are unverified.
  Independent header-chain/merkle verification in the Fulcrum-backed on-chain wallet remains unimplemented.
  The configured Fulcrum server remains trusted for chain state.
  Configure your own Fulcrum server for on-chain wallets; no default Fulcrum server is bundled.
  The first four screenshots show an earlier empty demo wallet on an emulator; the manual 3.12 USDC
  quote is illustrative, not a market price. Do not fund the pictured address.
  Thanks to BlueWallet and the contributors, reviewers and testers.

  Android now includes an embedded LND node for the live XBT/BLAKE2b network.
  It connects to built-in public XBT peers or your own compact-filter peer.
  Create invoice QR codes, tap to view invoice text, and copy or share the full invoice.
  The Lightning screen scrolls across the QR panel to reach payment controls.
  View active and pending channels, payment history, and node activity.
  Review payments and withdrawals, manage channels, and export encrypted recovery files.
  This updates the original RedWallet app and retains its signing identity.
  The Lightning invoice screenshots show this candidate with an empty emulator wallet.
  Automated checks cover public sync and disposable-chain payments and recovery.
  An installed upgrade on an Android emulator preserved an existing empty wallet
  and its receiving address without clearing app data.
  Android 8.0 or newer is required; this APK supports arm64-v8a and x86_64.
  Physical Android phones and funded live payments remain unverified.
  Tor/.onion Lightning peers and continuous background operation are unsupported.
