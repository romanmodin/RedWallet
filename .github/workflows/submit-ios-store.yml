name: Submit verified RedWallet iOS app for review
"on":
  pull_request:
    paths:
      - ".github/scripts/submit-ios-store.mjs"
      - ".github/scripts/test-submit-ios-store.mjs"
      - ".github/scripts/replace-ios-review.mjs"
      - ".github/scripts/test-replace-ios-review.mjs"
      - ".github/release/IOS-APP-REVIEW-INPUTS-20261019.json"
      - ".github/workflows/submit-ios-store.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: redwallet-app-review-submission
  cancel-in-progress: false
env:
  SOURCE_COMMIT: 9f627fb87b4b6cc28cddcf6ad45e2edc721551a8
  CI_RUN_ID: "39297579896"
  IOS_RUN_ID: "39297579842"
  FUNDED_IOS_RUN_ID: "39297639315"
  UPLOAD_RUN_ID: "39312792179"
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: node --test .github/scripts/test-submit-ios-store.mjs .github/scripts/test-replace-ios-review.mjs
  submit:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    environment: ios-upload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Verify qualification and download the actual reviewed release receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I .github/scripts/verify-ios-release-gates.py
          python3 - <<'PY'
          import subprocess,json,hashlib,zipfile,io
          from pathlib import Path
          repo='romanmodin/RedWallet'
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}']))
          m=json.loads(Path('.github/release/IOS-APP-REVIEW-INPUTS-20261019.json').read_text())
          assert m['sourceCommit']=='9f627fb87b4b6cc28cddcf6ad45e2edc721551a8'
          expected={
            'ios-ipa-verification.json':'.github/workflows/build-ios-approved-source.yml',
            'testflight-beta-verification.json':'.github/workflows/distribute-ios-beta.yml',
            'store-screenshot-receipt.json':'.github/workflows/upload-ios-store-screenshots.yml',
            'imessage-upload-receipt.json':'.github/workflows/upload-ios-imessage-screenshots.yml'}
          assert len(m['receipts'])==4 and {x['member'] for x in m['receipts']}==set(expected)
          root=Path('submission-receipts');root.mkdir()
          for receipt in m['receipts']:
              r=api(f"actions/runs/{receipt['runId']}")
              assert r['head_sha']==receipt['head'] and r['path']==expected[receipt['member']]
              assert r['repository']['full_name']==repo and r['head_repository']['full_name']==repo
              assert r['head_branch']=='main' and r['event']=='workflow_dispatch'
              assert r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'
              if receipt['member']=='ios-ipa-verification.json':
                  assert r['id']==39312792179 and r['head_sha']=='2e48763dfe0b1dd90763c47323143af527bd8148'
              a=api(f"actions/artifacts/{receipt['artifactId']}")
              assert not a['expired'] and a['workflow_run']['id']==r['id'] and a['digest']=='sha256:'+receipt['archiveSha256']
              b=subprocess.check_output(['gh','api',f"repos/{repo}/actions/artifacts/{receipt['artifactId']}/zip"])
              assert hashlib.sha256(b).hexdigest()==receipt['archiveSha256']
              z=zipfile.ZipFile(io.BytesIO(b));assert z.namelist().count(receipt['member'])==1
              data=z.read(receipt['member']);assert hashlib.sha256(data).hexdigest()==receipt['sha256']
              (root/receipt['member']).write_bytes(data)
          PY
      - name: Verify exact uploaded package against the qualified source
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_RECEIPT_PATH: ${{ github.workspace }}/submission-receipts/ios-ipa-verification.json
        run: python3 -I .github/scripts/verify-uploaded-beta.py
      - name: Select the new build and submit the reviewed version to Apple
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: node .github/scripts/submit-ios-store.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: app-review-submission
          path: app-review-submission.json
          if-no-files-found: ignore
          retention-days: 30
