name: Submit verified RedWallet iOS app for review
"on":
  pull_request:
    paths:
      - ".github/scripts/submit-ios-store.mjs"
      - ".github/scripts/test-submit-ios-store.mjs"
      - ".github/scripts/replace-ios-review.mjs"
      - ".github/scripts/test-replace-ios-review.mjs"
      - ".github/release/IOS-V4-APP-REVIEW-INPUTS-20261022.json"
      - ".github/workflows/submit-ios-store.yml"
      - ".github/scripts/download-ios-review-receipts.py"
      - ".github/release/IOS-V4-IMESSAGE-REUSE-20261022.json"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: redwallet-app-review-submission
  cancel-in-progress: false
env:
  SOURCE_COMMIT: 286e875cb488365eeb00799b6c04305994ab9db7
  CI_RUN_ID: "39711126561"
  IOS_RUN_ID: "39711126600"
  FUNDED_IOS_RUN_ID: "39711154580"
  UPLOAD_RUN_ID: "39799087741"
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: node --test .github/scripts/test-submit-ios-store.mjs .github/scripts/test-replace-ios-review.mjs
  submit:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    environment: ios-upload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Verify qualification and download the actual reviewed release receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I .github/scripts/verify-ios-release-gates.py
          python3 -I .github/scripts/download-ios-review-receipts.py .github/release/IOS-V4-APP-REVIEW-INPUTS-20261022.json
      - name: Verify exact uploaded package against the qualified source
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_RECEIPT_PATH: ${{ github.workspace }}/submission-receipts/ios-ipa-verification.json
        run: python3 -I .github/scripts/verify-uploaded-beta.py
      - name: Select the new build and submit the reviewed version to Apple
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: node .github/scripts/submit-ios-store.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: app-review-submission
          path: app-review-submission.json
          if-no-files-found: ignore
          retention-days: 30
