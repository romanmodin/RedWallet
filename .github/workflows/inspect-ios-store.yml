name: Inspect RedWallet App Store readiness
"on":
  pull_request:
    paths:
      - ".github/scripts/inspect-ios-store.mjs"
      - ".github/scripts/test-inspect-ios-store.mjs"
      - ".github/workflows/inspect-ios-store.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: redwallet-store-readiness
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: node --test .github/scripts/test-inspect-ios-store.mjs
  inspect:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    environment: ios-upload
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Read existing RedWallet submission state
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: node .github/scripts/inspect-ios-store.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-store-readiness
          path: ios-store-readiness.json
          if-no-files-found: error
          retention-days: 7
