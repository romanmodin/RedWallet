name: Kilowallet — Apple signing bridge
on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload only after the separate Kilowallet Apple app record exists
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: kilowallet-apple-upload
  cancel-in-progress: false
jobs:
  certificate:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: ios-signing
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9
        with:
          ruby-version: 3.4.10
      - name: Install verified signing-storage tooling
        run: |
          gem fetch fastlane --version 2.237.0
          printf '%s\n' 'bb1e867bc070fb328741b5e6e7606d5ba596941a9ecca0478f60ef22d1009db9  fastlane-2.237.0.gem' | shasum -a 256 -c -
          gem install ./fastlane-2.237.0.gem --no-document
      - name: Read existing distribution identity and encrypt transfer
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GIT_URL: ${{ secrets.GIT_URL }}
          GIT_PRIVATE_KEY_CONTENT: ${{ secrets.GIT_PRIVATE_KEY_CONTENT }}
          IPA_ARTIFACT_KEY: ${{ secrets.IPA_ARTIFACT_KEY }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          GH_TOKEN: ${{ github.token }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
        run: |
          set -euo pipefail
          umask 077
          signing_key="$RUNNER_TEMP/kilowallet-storage-key"
          trap 'rm -f "$signing_key" "$RUNNER_TEMP/kilowallet-identity.json"' EXIT
          printf '%s\n' "$GIT_PRIVATE_KEY_CONTENT" > "$signing_key"
          unset GIT_PRIVATE_KEY_CONTENT
          export MATCH_GIT_PRIVATE_KEY="$signing_key"
          mkdir -p "$HOME/.ssh"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i \"$signing_key\" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
          ruby <<'RUBY'
          require 'fastlane'; require 'match'; require 'json'; require 'base64'; require 'openssl'; require 'open3'
          raise 'Unexpected Apple team' unless ENV.fetch('TEAM_ID') == 'PPG9C98EY9'
          raise 'Unexpected signing storage' unless ENV.fetch('GIT_URL') == 'git@github.com:romanmodin/RedWallet-signing.git'
          params = FastlaneCore::Configuration.create(Match::Options.available_options, {storage_mode:'git',git_url:ENV.fetch('GIT_URL'),git_branch:'main',git_private_key:ENV.fetch('MATCH_GIT_PRIVATE_KEY'),readonly:true,type:'appstore',platform:'ios'})
          storage = nil
          begin
            storage = Match::Storage.from_params(params); storage.download
            encryption = Match::Encryption.for_storage_mode('git', {git_url:params[:git_url],working_directory:storage.working_directory,force_legacy_encryption:false})
            encryption.decrypt_files
            pairs = Dir[File.join(storage.working_directory,'certs','distribution','*.cer')].filter_map do |file|
              p12file=file.sub(/\.cer\z/,'.p12'); next unless File.file?(p12file)
              cert=OpenSSL::X509::Certificate.new(File.binread(file))
              subject=cert.subject.to_a.to_h { |key,value,_| [key,value] }
              next unless subject['OU']==ENV.fetch('TEAM_ID') && subject['CN'].start_with?('Apple Distribution:') && cert.not_after>Time.now
              begin
                key=OpenSSL::PKey.read(File.binread(p12file))
              rescue OpenSSL::PKey::PKeyError, ArgumentError
                prefix,brew_status=Open3.capture2('brew','--prefix','openssl@3')
                raise 'OpenSSL 3 prefix unavailable' unless brew_status.success?
                openssl=File.join(prefix.strip,'bin','openssl')
                pem,_,status=Open3.capture3(openssl,'pkcs12','-legacy','-in',p12file,'-passin','pass:','-nodes')
                raise 'Cannot read existing distribution key' unless status.success?
                key=OpenSSL::PKey.read(pem)
              end
              raise 'Certificate/private-key mismatch' unless cert.check_private_key(key)
              normalized=OpenSSL::PKCS12.create('','Kilowallet distribution',key,cert).to_der
              [cert.to_der,normalized]
            end
            raise 'Expected exactly one usable existing distribution identity' unless pairs.length==1
            File.write(File.join(ENV.fetch('RUNNER_TEMP'),'kilowallet-identity.json'),JSON.generate({cer:Base64.strict_encode64(pairs[0][0]),p12:Base64.strict_encode64(pairs[0][1])}),mode:'w',perm:0600)
          ensure
            storage.clear_changes if storage
          end
          RUBY
          node <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const key=Buffer.from(process.env.IPA_ARTIFACT_KEY,'base64');
          if(key.length!==32)throw Error('Invalid transfer key');
          const iv=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',key,iv);
          cipher.setAAD(Buffer.from(`KilowalletIdentity:${process.env.GITHUB_SHA}:${process.env.GITHUB_RUN_ID}`));
          const encrypted=Buffer.concat([cipher.update(fs.readFileSync(process.env.RUNNER_TEMP+'/kilowallet-identity.json')),cipher.final()]);
          fs.writeFileSync('kilowallet-identity.enc',Buffer.concat([Buffer.from('KWID01'),iv,cipher.getAuthTag(),encrypted]),{mode:0o600});
          JS
          echo 'Existing distribution identity verified; encrypted transfer only.'
      - name: Transfer encrypted identity to this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Kilowallet_Encrypted_Identity
          path: kilowallet-identity.enc
          retention-days: 1
  sign:
    needs: certificate
    environment: ios-upload
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.TEAM_ID }}
      APPLE_UPLOAD: '0'
    steps:
      - name: Select supported Xcode for iPhone archive
        run: |
          test -d /Applications/Xcode_26.3.app
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          path: signing
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: romanmodin/kilowallet-ios
          ref: a9e56783d896ae72e263ec53fe644797ad433791
          persist-credentials: false
          path: app
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Check pinned app source
        run: test "$(git -C app rev-parse HEAD)" = a9e56783d896ae72e263ec53fe644797ad433791
      - name: Install Apple-signed Transporter for TestFlight uploads
        if: ${{ inputs.upload_to_testflight }}
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            'https://itunesconnect.apple.com/WebObjects/iTunesConnect.woa/ra/resources/download/public/Transporter__OSX/bin/' \
            --output "$RUNNER_TEMP/Apple-Transporter.pkg"
          pkgutil --check-signature "$RUNNER_TEMP/Apple-Transporter.pkg" > "$RUNNER_TEMP/Transporter-signature.txt"
          grep -q 'Apple Inc.' "$RUNNER_TEMP/Transporter-signature.txt"
          spctl --assess --type install "$RUNNER_TEMP/Apple-Transporter.pkg"
          sudo installer -pkg "$RUNNER_TEMP/Apple-Transporter.pkg" -target /
          /usr/local/itms/bin/iTMSTransporter -version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Kilowallet_Encrypted_Identity
          path: ${{ runner.temp }}/identity-transfer
      - name: Authenticate encrypted identity
        env:
          IPA_ARTIFACT_KEY: ${{ secrets.IPA_ARTIFACT_KEY }}
        run: |
          node <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const data=fs.readFileSync(process.env.RUNNER_TEMP+'/identity-transfer/kilowallet-identity.enc'),key=Buffer.from(process.env.IPA_ARTIFACT_KEY,'base64');
          if(key.length!==32||data.length<34||data.subarray(0,6).toString()!=='KWID01')throw Error('Invalid identity transfer');
          const decipher=crypto.createDecipheriv('aes-256-gcm',key,data.subarray(6,18));
          decipher.setAAD(Buffer.from(`KilowalletIdentity:${process.env.GITHUB_SHA}:${process.env.GITHUB_RUN_ID}`));
          decipher.setAuthTag(data.subarray(18,34));
          const identity=JSON.parse(Buffer.concat([decipher.update(data.subarray(34)),decipher.final()]));
          const dir=process.env.RUNNER_TEMP+'/Kilowallet-signing';fs.mkdirSync(dir,{mode:0o700});
          fs.writeFileSync(dir+'/distribution.cer',Buffer.from(identity.cer,'base64'),{mode:0o600});
          fs.writeFileSync(dir+'/distribution.p12',Buffer.from(identity.p12,'base64'),{mode:0o600});
          JS
      - name: Prepare temporary Apple credentials
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: python3 signing/distribution/kilowallet/prepare_signing.py
      - name: Create dedicated Kilowallet store profiles
        run: |
          python3 signing/distribution/kilowallet/manual_profiles.py
      - name: Import existing certificate into temporary keychain
        run: |
          set -euo pipefail
          umask 077
          keychain_pass=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_pass"
          keychain_path="$RUNNER_TEMP/Kilowallet-signing.keychain-db"
          security create-keychain -p "$keychain_pass" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_pass" "$keychain_path"
          "$(brew --prefix openssl@3)/bin/openssl" pkcs12 -in "$RUNNER_TEMP/Kilowallet-signing/distribution.p12" -passin pass: -nodes -nocerts -out "$RUNNER_TEMP/Kilowallet-signing/distribution.key"
          security import "$RUNNER_TEMP/Kilowallet-signing/distribution.cer" -k "$keychain_path" -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/Kilowallet-signing/distribution.key" -k "$keychain_path" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pass" "$keychain_path" > /dev/null
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain_path"
      - name: Archive pinned Kilowallet source
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Kilowallet.xcarchive" \
            TEAM_ID="$TEAM_ID" DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$KILOWALLET_PROFILE" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive > "$RUNNER_TEMP/archive.log" 2>&1 || {
              tail -n 100 "$RUNNER_TEMP/archive.log"; exit 1;
            }
      - name: Verify archive and export package
        run: |
          set -euo pipefail
          python3 signing/distribution/kilowallet/verify_package.py "$RUNNER_TEMP/Kilowallet.xcarchive/Products/Applications/Kilowallet.app"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Kilowallet.xcarchive" \
            -exportPath "$RUNNER_TEMP/Kilowallet-export" -exportOptionsPlist "$APPLE_EXPORT_OPTIONS"
          python3 signing/distribution/kilowallet/verify_package.py "$RUNNER_TEMP/Kilowallet-export/Kilowallet.ipa"
      - name: Upload Kilowallet to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$APPLE_API_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          /usr/local/itms/bin/iTMSTransporter -m upload -assetFile "$RUNNER_TEMP/Kilowallet-export/Kilowallet.ipa" \
            -v informational -apiKey "$APPLE_API_KEY_ID" -apiIssuer "$APPLE_API_ISSUER_ID"
      - name: Verify Apple processing
        if: ${{ inputs.upload_to_testflight }}
        run: python3 signing/distribution/kilowallet/verify_processing.py
      - name: Clean up temporary credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/Kilowallet-signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/Kilowallet-signing" "$RUNNER_TEMP/identity-transfer" "$HOME/.appstoreconnect/private_keys"
          rm -f "$RUNNER_TEMP/Kilowallet-AuthKey.p8" "$RUNNER_TEMP/Kilowallet-ExportOptions.plist"
