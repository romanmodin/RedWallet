name: Android release safety
on:
  pull_request:
    paths:
      - .github/scripts/verify-android-release-gates.py
      - .github/scripts/test-android-release-gates.py
      - .github/workflows/build-android-approved-source.yml
      - .github/workflows/android-release-safety.yml
permissions:
  contents: read
jobs:
  gate-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify fail-closed release gate checks
        run: python3 -I .github/scripts/test-android-release-gates.py
