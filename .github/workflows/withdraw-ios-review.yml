name: Withdraw superseded review after verified v4 delivery
"on":
  pull_request:
    paths:
      - .github/scripts/withdraw-ios-review.mjs
      - .github/scripts/test-withdraw-ios-review.mjs
      - .github/scripts/replace-ios-review.mjs
      - .github/scripts/test-replace-ios-review.mjs
      - .github/scripts/download-ios-review-receipts.py
      - .github/release/IOS-V4-WITHDRAWAL-INPUTS-20261022.json
      - .github/workflows/withdraw-ios-review.yml
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Read-only live preflight; false permits the already-authorized exact old review withdrawal
        type: boolean
        required: true
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: redwallet-app-review-submission
  cancel-in-progress: false
env:
  SOURCE_COMMIT: 14b44bf69a346e1a0787e6aed1f3d3343950a0f1
  CI_RUN_ID: "40165351100"
  IOS_RUN_ID: "40165351044"
  FUNDED_IOS_RUN_ID: "40165641068"
  UPLOAD_RUN_ID: "40174840984"
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run:
          node --test .github/scripts/test-withdraw-ios-review.mjs .github/scripts/test-replace-ios-review.mjs
          .github/scripts/test-submit-ios-store.mjs
  withdraw:
    needs: verify
    if:
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      }}
    environment: ios-upload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Verify qualification, native sticker identity and actual release receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: "python3 -I .github/scripts/verify-ios-release-gates.py\npython3 .github/scripts/download-ios-review-receipts.py .github/release/IOS-V4-WITHDRAWAL-INPUTS-20261022.json\npython3 - <<'PYCODE'\nimport subprocess,json\nfrom pathlib import Path\nm=json.loads(Path('.github/release/IOS-STORE-SCREENSHOTS-20261019.json').read_text())\nassert m['sourceCommit']=='14b44bf69a346e1a0787e6aed1f3d3343950a0f1' and m['visuallyReviewed'] is True and m['captureRunId']==40184204898\nr=json.loads(subprocess.check_output(['gh','api','repos/romanmodin/RedWallet/actions/runs/40184204898']))\nassert r['repository']['full_name']=='romanmodin/RedWallet' and r['head_repository']['full_name']=='romanmodin/RedWallet'\nassert r['head_sha']=='a445e7fd56813d9f3da79384d995bd4aedd9e71d' and r['path']=='.github/workflows/capture-ios-store-screenshots.yml'\nassert r['event']=='workflow_dispatch' and r['head_branch']=='main' and r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='success'\nfor artifact in m['artifacts']:\n family=artifact['family']\n expected={'iphone':(40184204898,'a445e7fd56813d9f3da79384d995bd4aedd9e71d',12595956217),'ipad':(40174842631,'d9af98430004a04e521a98b52780b8e79be1565f',12591509262)}\n assert (artifact['runId'],artifact['head'],artifact['id'])==expected[family]\n run=json.loads(subprocess.check_output(['gh','api',f\"repos/romanmodin/RedWallet/actions/runs/{artifact['runId']}\"]))\n assert run['repository']['full_name']==run['head_repository']['full_name']=='romanmodin/RedWallet'\n assert run['head_sha']==artifact['head'] and run['path']=='.github/workflows/capture-ios-store-screenshots.yml'\n assert run['event']=='workflow_dispatch' and run['head_branch']=='main' and run['run_attempt']==1\n assert run['status']=='completed' and run['conclusion']=='success'\n jobs=json.loads(subprocess.check_output(['gh','api',f\"repos/romanmodin/RedWallet/actions/runs/{artifact['runId']}/attempts/1/jobs?per_page=100\"]))['jobs']\n assert any(j['name']=='capture ('+family+')' and j['conclusion']=='success' for j in jobs)\n meta=json.loads(subprocess.check_output(['gh','api',f\"repos/romanmodin/RedWallet/actions/artifacts/{artifact['id']}\"]))\n assert meta['workflow_run']['id']==artifact['runId'] and meta['digest']=='sha256:'+artifact['sha256'] and not meta['expired']\nfor source in ['9f627fb87b4b6cc28cddcf6ad45e2edc721551a8','14b44bf69a346e1a0787e6aed1f3d3343950a0f1']:\n assert subprocess.check_output(['git','rev-parse',source+':ios'],text=True).strip()=='30e39cdee442e7d716cdc95de44ada6df2a523b7'\nPYCODE\n"
      - name: Verify exact uploaded package against the qualified source
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_RECEIPT_PATH: ${{ github.workspace }}/submission-receipts/ios-ipa-verification.json
        run: python3 -I .github/scripts/verify-uploaded-beta.py
      - name: Withdraw only the known superseded review
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT:
            ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT
            }}
          WITHDRAWAL_PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
        run: node .github/scripts/withdraw-ios-review.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: app-review-withdrawal
          path: app-review-withdrawal.json
          if-no-files-found: ignore
          retention-days: 30
