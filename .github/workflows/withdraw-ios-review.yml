name: Withdraw superseded review after verified v4 delivery
"on":
  pull_request:
    paths:
      - .github/scripts/withdraw-ios-review.mjs
      - .github/scripts/test-withdraw-ios-review.mjs
      - .github/scripts/replace-ios-review.mjs
      - .github/scripts/test-replace-ios-review.mjs
      - .github/scripts/download-ios-review-receipts.py
      - .github/release/IOS-V4-WITHDRAWAL-INPUTS-20261022.json
      - .github/workflows/withdraw-ios-review.yml
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Read-only live preflight; false permits the already-authorized exact old review withdrawal
        type: boolean
        required: true
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: redwallet-app-review-submission
  cancel-in-progress: false
env:
  SOURCE_COMMIT: 9bc111733801849786a5026a04325afd269e20c0
  CI_RUN_ID: "40084845943"
  IOS_RUN_ID: "40084845962"
  FUNDED_IOS_RUN_ID: "40084873225"
  UPLOAD_RUN_ID: "40093078804"
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run:
          node --test .github/scripts/test-withdraw-ios-review.mjs .github/scripts/test-replace-ios-review.mjs
          .github/scripts/test-submit-ios-store.mjs
  withdraw:
    needs: verify
    if:
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      }}
    environment: ios-upload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Verify qualification, native sticker identity and actual release receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run:
          "python3 -I .github/scripts/verify-ios-release-gates.py\npython3 .github/scripts/download-ios-review-receipts.py\
          \ .github/release/IOS-V4-WITHDRAWAL-INPUTS-20261022.json\npython3 - <<'PYCODE'\n\
          import subprocess,json\nfrom pathlib import Path\nm=json.loads(Path('.github/release/IOS-STORE-SCREENSHOTS-20261019.json').read_text())\n\
          assert m['sourceCommit']=='9bc111733801849786a5026a04325afd269e20c0' and m['visuallyReviewed']\
          \ is True and m['captureRunId']==40093081291\nr=json.loads(subprocess.check_output(['gh','api','repos/romanmodin/RedWallet/actions/runs/40093081291']))\n\
          assert r['repository']['full_name']=='romanmodin/RedWallet' and r['head_repository']['full_name']=='romanmodin/RedWallet'\n\
          assert r['head_sha']=='4b1f4acebbbaea5a173ca187f578fd7009206083' and r['path']=='.github/workflows/capture-ios-store-screenshots.yml'\n\
          assert r['event']=='workflow_dispatch' and r['head_branch']=='main' and r['run_attempt']==1\
          \ and r['status']=='completed' and r['conclusion']=='success'\nfor source\
          \ in ['9f627fb87b4b6cc28cddcf6ad45e2edc721551a8','9bc111733801849786a5026a04325afd269e20c0']:\n\
          \ assert subprocess.check_output(['git','rev-parse',source+':ios'],text=True).strip()=='30e39cdee442e7d716cdc95de44ada6df2a523b7'\n\
          PYCODE\n"
      - name: Verify exact uploaded package against the qualified source
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_RECEIPT_PATH: ${{ github.workspace }}/submission-receipts/ios-ipa-verification.json
        run: python3 -I .github/scripts/verify-uploaded-beta.py
      - name: Withdraw only the known superseded review
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT:
            ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT
            }}
          WITHDRAWAL_PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
        run: node .github/scripts/withdraw-ios-review.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: app-review-withdrawal
          path: app-review-withdrawal.json
          if-no-files-found: ignore
          retention-days: 30
