name: Kilowallet Apple release preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: ios-upload
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read only Kilowallet Apple application and bundle records
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        shell: python
        run: |
          import base64, json, os, pathlib, re, subprocess, tempfile, time, urllib.request, urllib.error, urllib.parse
          if os.environ.get('TEAM_ID') != 'PPG9C98EY9':
              raise SystemExit('Unexpected Apple team; stop before using credentials')
          credential = json.loads(os.environ.pop('APP_STORE_CONNECT_API_KEY_CONTENT'))
          key = credential['key']
          if credential.get('is_key_content_base64'): key = base64.b64decode(key, validate=True).decode()
          kid, issuer = credential['key_id'], credential['issuer_id']
          if not re.fullmatch(r'[A-Z0-9]{10}', kid) or not re.fullmatch(r'[a-fA-F0-9-]{36}', issuer):
              raise SystemExit('Invalid credential metadata')
          def b64(b): return base64.urlsafe_b64encode(b).rstrip(b'=').decode()
          now = int(time.time())
          unsigned = '.'.join(b64(json.dumps(v, separators=(',', ':')).encode()) for v in [
              {'alg':'ES256','kid':kid,'typ':'JWT'},
              {'iss':issuer,'iat':now-30,'exp':now+300,'aud':'appstoreconnect-v1'}])
          with tempfile.TemporaryDirectory(prefix='kilowallet-api-') as d:
              kp = pathlib.Path(d)/'key.p8'; kp.write_text(key); kp.chmod(0o600)
              signature = subprocess.check_output(['openssl','dgst','-sha256','-sign',str(kp)], input=unsigned.encode(), stderr=subprocess.DEVNULL)
          if signature[0] != 0x30 or signature[2] != 2: raise SystemExit('Invalid signature encoding')
          n = signature[3]; r = int.from_bytes(signature[4:4+n], 'big'); at = 4+n
          if signature[at] != 2: raise SystemExit('Invalid signature encoding')
          n = signature[at+1]; s = int.from_bytes(signature[at+2:at+2+n], 'big')
          token = unsigned + '.' + b64(r.to_bytes(32,'big') + s.to_bytes(32,'big'))
          report = {'team_id':'PPG9C98EY9','observed_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'mode':'read-only'}
          for kind, field in [('apps','bundleId'),('bundleIds','identifier')]:
              url = 'https://api.appstoreconnect.apple.com/v1/' + kind + '?filter%5B' + field + '%5D=com.kilombino.kilowallet&limit=10'
              request = urllib.request.Request(url, headers={'Authorization':'Bearer '+token})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response: body=json.load(response)
                  report[kind] = [{'id':v['id'], **{k:v.get('attributes',{}).get(k) for k in ['name',field]}} for v in body.get('data',[])]
              except urllib.error.HTTPError as e:
                  report[kind] = {'http_status':e.code}
          if len(report.get('apps',[])) != 1 or report['apps'][0]['id'] != '6824331953':
              raise SystemExit('Unexpected Kilowallet app')
          def get(path):
              parsed=urllib.parse.urlsplit(path)
              declarations=(parsed.path=='/v1/appEncryptionDeclarations' and urllib.parse.parse_qs(parsed.query).get('filter[app]')==['6824331953'])
              if not declarations and not path.startswith(('/v1/apps/6824331953/', '/v1/builds', '/v2/appAvailabilities/')):
                  raise RuntimeError('Unexpected read-only resource')
              report['lastOperation']='GET '+path
              req=urllib.request.Request('https://api.appstoreconnect.apple.com'+path,method='GET',headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=30) as response: return json.load(response)
          def collection(path):
              values=[];seen=set()
              for page in range(5):
                  if path in seen: raise RuntimeError('Cyclic pagination')
                  seen.add(path);body=get(path);values.extend(body['data']);link=body.get('links',{}).get('next')
                  if not link: return values
                  if not link.startswith('https://api.appstoreconnect.apple.com/'): raise RuntimeError('Unexpected pagination host')
                  path=link.removeprefix('https://api.appstoreconnect.apple.com')
              raise RuntimeError('Incomplete Apple collection')
          try:
              report['encryptionDeclarations']=[{'id':d['id'],**{k:d['attributes'].get(k) for k in ['appDescription','usesEncryption','exempt','containsProprietaryCryptography','containsThirdPartyCryptography','availableOnFrenchStore','appEncryptionDeclarationState','codeValue']}} for d in collection('/v1/appEncryptionDeclarations?filter%5Bapp%5D=6824331953&limit=200')]
              report['betaGroups']=[{'id':d['id'],**{k:d['attributes'].get(k) for k in ['name','isInternalGroup','publicLinkEnabled']}} for d in collection('/v1/apps/6824331953/betaGroups?limit=200')]
              availability=get('/v1/apps/6824331953/appAvailabilityV2')['data'];aid=availability['id']
              if not re.fullmatch(r'[A-Za-z0-9-]+',aid): raise RuntimeError('Invalid availability identity')
              territories=collection('/v2/appAvailabilities/'+aid+'/territoryAvailabilities?include=territory&limit=200')
              report['availableTerritories']=sorted(t['relationships']['territory']['data']['id'] for t in territories if t['attributes']['available'])
              report['availableInNewTerritories']=availability['attributes']['availableInNewTerritories']
              report['recentBuilds']=[]
              for build in collection('/v1/builds?filter%5Bapp%5D=6824331953&limit=10&sort=-uploadedDate'):
                  bid=build['id']
                  if not re.fullmatch(r'[A-Za-z0-9-]+',bid): raise RuntimeError('Invalid build identity')
                  detail=get('/v1/builds/'+bid+'/buildBetaDetail')['data'];release=get('/v1/builds/'+bid+'/preReleaseVersion')['data'];declaration=get('/v1/builds/'+bid+'/appEncryptionDeclaration')['data']
                  report['recentBuilds'].append({'id':bid,'build':build['attributes']['version'],'marketingVersion':release['attributes']['version'],'processingState':build['attributes']['processingState'],'usesNonExemptEncryption':build['attributes'].get('usesNonExemptEncryption'),'internalBuildState':detail['attributes'].get('internalBuildState'),'externalBuildState':detail['attributes'].get('externalBuildState'),'declarationId':declaration['id'] if declaration else None})
              report['inspectionComplete']=True
          except Exception as error:
              report['inspectionComplete']=False
              report['inspectionError']={'kind':type(error).__name__,'httpStatus':getattr(error,'code',None)}
          print(json.dumps(report,indent=2))
          pathlib.Path('kilowallet-apple-preflight.json').write_text(json.dumps(report,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('```json\n'+json.dumps(report,indent=2)+'\n```\n')
          if not report['inspectionComplete']: raise SystemExit('Read-only Apple inspection incomplete; safe partial receipt retained')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kilowallet-apple-preflight
          path: kilowallet-apple-preflight.json
          retention-days: 7
