name: Assign verified Taproot TestFlight beta
"on":
  pull_request:
    paths:
      - ".github/scripts/distribute-ios-beta.rb"
      - ".github/scripts/test-distribute-ios-beta.rb"
      - ".github/scripts/verify-uploaded-beta.py"
      - ".github/release/taproot-beta-notes.txt"
      - ".github/workflows/distribute-ios-beta.yml"
  workflow_dispatch:
    inputs:
      upload_run_id:
        description: Reviewed completed upload run for Taproot build 1791098754
        required: true
        type: string
        default: "37188039652"
permissions:
  contents: read
  actions: read
concurrency:
  group: verified-taproot-beta-assignment
  cancel-in-progress: false
env:
  FASTLANE_OPT_OUT_USAGE: "1"
  FASTLANE_SKIP_UPDATE_CHECK: "1"
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9
        with:
          ruby-version: 3.4.10
      - name: Install existing locked dependencies
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3 --quiet
      - name: Validate script and run offline safety checks
        run: |
          bundle exec ruby -c .github/scripts/distribute-ios-beta.rb
          bundle exec ruby .github/scripts/test-distribute-ios-beta.rb
          python3 -m py_compile .github/scripts/verify-uploaded-beta.py
  distribute:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    environment: ios-upload
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      UPLOAD_RUN_ID: ${{ inputs.upload_run_id }}
      UPLOAD_RECEIPT_PATH: ${{ github.workspace }}/upload-receipt/ios-ipa-verification.json
      BETA_NOTES_PATH: ${{ github.workspace }}/.github/release/taproot-beta-notes.txt
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ios-ipa-verification
          path: upload-receipt
          run-id: ${{ inputs.upload_run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact uploaded package and native gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/verify-uploaded-beta.py
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9
        with:
          ruby-version: 3.4.10
      - name: Install existing locked dependencies
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3 --quiet
      - name: Set temporary credential path
        run: printf 'APPLE_API_KEY_PATH=%s/redwallet-beta-api-key.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Assign existing tester groups and verify Apple status
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          umask 077
          printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$APPLE_API_KEY_PATH"
          bundle exec ruby .github/scripts/distribute-ios-beta.rb
      - name: Remove temporary API credential
        if: always()
        run: rm -f "$APPLE_API_KEY_PATH"
      - name: Save Apple tester-status verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: testflight-beta-verification
          path: testflight-beta-verification.json
          if-no-files-found: ignore
          retention-days: 7
