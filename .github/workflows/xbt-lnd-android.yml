name: Android embedded XBT Lightning regtest
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/scripts/build-xbt-lnd-android.sh'
      - '.github/workflows/xbt-lnd-android.yml'
      - 'screen/settings/XBTLightning.tsx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Free build space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          npm ci
      - name: Build pinned Android Lightning engine
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" .github/scripts/build-xbt-lnd-android.sh "$RUNNER_TEMP/Lndmobile.aar"
      - name: Compile the isolated Android test build
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleRelease -PxbtRegtestAar="$RUNNER_TEMP/Lndmobile.aar" -PreactNativeArchitectures=arm64-v8a,x86_64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: redwallet-android-xbt-regtest-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
