name: Embedded XBT LND
on:
  pull_request:
    paths:
      - 'ios/XBTLightning/**'
      - 'ios/Podfile'
      - 'ios/Podfile.lock'
      - 'patches/react-native+*.patch'
      - 'blue_modules/lightning-bridge/**'
      - 'components/CrossChainLightning.tsx'
      - 'tests/unit/lightning-bridge.test.ts'
      - 'tests/integration/lightning-cross-chain-bridge.test.ts'
      - 'tests/unit/cross-chain-lightning.test.tsx'
      - 'ios/BlueWallet/XBTLightningBridge.*'
      - 'screen/settings/XBTLightning.tsx'
      - 'components/XBTLightningNodeName.tsx'
      - 'tests/unit/xbt-lightning-node-name.test.tsx'
      - 'screen/send/psbtWithHardwareWallet.tsx'
      - 'screen/send/SendDetails.tsx'
      - 'class/wallet-import.ts'
      - 'class/wallets/abstract-hd-electrum-wallet.ts'
      - 'components/TotalWalletsBalance.tsx'
      - 'components/Context/SettingsProvider.tsx'
      - 'components/TransactionListItem.tsx'
      - 'screen/wallets/LndWalletHome.tsx'
      - 'blue_modules/total-balance-display.ts'
      - 'blue_modules/BtcElectrum.ts'
      - 'screen/settings/BtcElectrumSettings.tsx'
      - 'screen/settings/NetworkSettings.tsx'
      - 'navigation/DetailViewScreensStack.tsx'
      - 'navigation/DetailViewStackParamList.ts'
      - 'tests/unit/btc-electrum.test.ts'
      - 'tests/unit/btc-electrum-settings.test.tsx'
      - 'tests/unit/total-wallets-balance-privacy.test.tsx'
      - 'tests/unit/lnd-wallet-home.test.tsx'
      - 'blue_modules/lnd-payment-status.ts'
      - 'tests/unit/xbt-lightning-screen.test.tsx'
      - 'tests/unit/lnd-payment-status.test.ts'
      - '.github/workflows/xbt-lnd-ios.yml'
      - '.github/actions/xbt-regtest-chain/**'
      - '.github/scripts/xbt-lnd-regtest-*'
      - '.github/scripts/test-tor-fee-fetch.sh'
permissions:
  contents: read
concurrency:
  group: xbt-lnd-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  tor-fee-unit:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash .github/scripts/test-tor-fee-fetch.sh
  release-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 .github/scripts/test-ios-release-gates.py
  regtest:
    strategy:
      fail-fast: false
      matrix:
        tier: [wallet, payments]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9
        with:
          ruby-version: '3.4.10'
          bundler-cache: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: matrix.tier == 'payments'
        with:
          go-version: '1.27.3'
          cache: false
      - name: Start the disposable chain and optional routing peer
        uses: ./.github/actions/xbt-regtest-chain
        with:
          routing: ${{ matrix.tier == 'payments' && 'true' || 'false' }}
      - name: Test the embedded engine on iPhone Simulator
        env:
          REGTEST_TIER: ${{ matrix.tier }}
        run: |
          set -eo pipefail
          bundle exec ruby .github/scripts/xbt-lnd-regtest-host.rb "$RUNNER_TEMP/xbt-host"
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project "$RUNNER_TEMP/xbt-host/RegtestHost.xcodeproj" -scheme RegtestHost -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO -skip-testing:RegtestHostTests/RegtestTests/testRestoresIdentityFromPortableFile test
          xcrun simctl bootstatus "$device" -b
          src=$(xcrun simctl get_app_container "$device" org.redwallet.sandbox.RegtestHost data)
          rebuilt="$RUNNER_TEMP/xbt-restore"
          mkdir -p "$rebuilt"
          cp "$src/Documents/RestoreFixture.rwln" "$src/Documents/RestoreIdentity.txt" "$rebuilt/"
          if [ "$REGTEST_TIER" = payments ]; then cp "$src/Documents/RestoreBalance.txt" "$rebuilt/"; fi
          REGTEST_RESTORE=1 bundle exec ruby .github/scripts/xbt-lnd-regtest-host.rb "$rebuilt"
          xcodebuild -project "$rebuilt/RegtestHost.xcodeproj" -scheme RegtestHost -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO -only-testing:RegtestHostTests/RegtestTests/testRestoresIdentityFromPortableFile test

      - name: Diagnose isolated peer failures
        if: failure()
        run: |
          for logfile in "$RUNNER_TEMP/lnd-regtest/fixture.log" "$RUNNER_TEMP/lnd-regtest/peer.log"; do
            if [ -f "$logfile" ]; then tail -40 "$logfile"; fi
          done

  public-sync:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9
        with:
          ruby-version: '3.4.10'
          bundler-cache: true
      - name: Sync a disposable public XBT node without funding it
        env:
          XBT_PUBLIC_SMOKE: '1'
        run: |
          set -eo pipefail
          bundle exec ruby .github/scripts/xbt-lnd-regtest-host.rb "$RUNNER_TEMP/xbt-public-host"
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project "$RUNNER_TEMP/xbt-public-host/RegtestHost.xcodeproj" -scheme RegtestHost -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO -only-testing:RegtestHostTests/MainnetSmokeTests test

  tor-smoke:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9
        with:
          ruby-version: '3.4.10'
          bundler-cache: true
      - name: Sync a disposable Tor XBT node without funding it
        env:
          XBT_TOR_SMOKE: '1'
        run: |
          set -eo pipefail
          bundle exec ruby .github/scripts/xbt-lnd-regtest-host.rb "$RUNNER_TEMP/xbt-tor-host"
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project "$RUNNER_TEMP/xbt-tor-host/RegtestHost.xcodeproj" -scheme RegtestHost -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO -only-testing:RegtestHostTests/TorSmokeTests test
