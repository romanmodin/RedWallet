name: Embedded XBT LND
on:
  pull_request:
    paths:
      - 'ios/XBTLightning/**'
      - 'ios/BlueWallet/XBTLightningBridge.*'
      - '.github/workflows/xbt-lnd-ios.yml'
      - '.github/scripts/xbt-lnd-regtest-*'
permissions:
  contents: read
concurrency:
  group: xbt-lnd-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  regtest:
    strategy:
      fail-fast: false
      matrix:
        tier: [wallet, payments]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: matrix.tier == 'payments'
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build the disposable XBT Lightning peer
        if: matrix.tier == 'payments'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/lnd-regtest"
          mkdir -p "$dir/ln-bin"
          git init -q "$dir/peer-src"
          git -C "$dir/peer-src" fetch -q --depth=1 https://github.com/Kilombino/lnd.git cae303b36594a2c48c9ce0cbb238672e3a1b284e
          git -C "$dir/peer-src" checkout -q --detach FETCH_HEAD
          cd "$dir/peer-src"
          go build -tags="routerrpc invoicesrpc" -o "$dir/ln-bin/" ./cmd/lnd ./cmd/lncli
      - name: Start a private compact-filter chain peer
        run: |
          set -euo pipefail
          key="macos_$(uname -m)"
          archive="$RUNNER_TEMP/knots.tar.gz"
          dir="$RUNNER_TEMP/lnd-regtest"
          mkdir -p "$dir/tools" "$dir/data"
          curl -fsSL --retry 2 "$(jq -r --arg k "$key" '.knots[$k].url' tests/native/backend-assets.json)" -o "$archive"
          printf '%s  %s\n' "$(jq -r --arg k "$key" '.knots[$k].sha256' tests/native/backend-assets.json)" "$archive" | shasum -a 256 -c -
          tar -xzf "$archive" --strip-components=1 -C "$dir/tools"
          "$dir/tools/bin/bitcoind" -datadir="$dir/data" -regtest -server -daemonwait -bind=127.0.0.1:18444 -rpcbind=127.0.0.1 -rpcallowip=127.0.0.1 -listenonion=0 -connect=0 -dnsseed=0 -discover=0 -blockfilterindex=1 -peerblockfilters=1 -fallbackfee=0.00001 -testactivationheight=blake2b@150
          cli=("$dir/tools/bin/bitcoin-cli" "-datadir=$dir/data" -regtest -rpcwait)
          "${cli[@]}" createwallet fixture >/dev/null
          "${cli[@]}" generatetoaddress 151 "$("${cli[@]}" getnewaddress)" >/dev/null
          header=$("${cli[@]}" getblockheader "$("${cli[@]}" getblockhash 150)" false)
          test "${#header}" -eq 328
      - name: Start the isolated routing peer
        if: matrix.tier == 'payments'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/lnd-regtest"
          fixture_cookie=$(<"$dir/data/regtest/.cookie")
          "$dir/ln-bin/lnd" --lnddir="$dir/ln-peer" --bitcoin.regtest --bitcoin.blake2b-activation-height=150 --bitcoin.node=bitcoind --bitcoind.rpchost=127.0.0.1:18443 --bitcoind.rpcuser="${fixture_cookie%%:*}" --bitcoind.rpcpass="${fixture_cookie#*:}" --bitcoind.rpcpolling --bitcoind.blockpollinginterval=500ms --rpclisten=127.0.0.1:11009 --listen=127.0.0.1:19735 --noseedbackup --nobootstrap --norest >"$dir/peer.log" 2>&1 &
          pid=$!
          ready=false
          for attempt in {1..90}; do
            if ! kill -0 "$pid" 2>/dev/null; then tail -12 "$dir/peer.log"; exit 1; fi
            if "$dir/ln-bin/lncli" --network=regtest --rpcserver=127.0.0.1:11009 --lnddir="$dir/ln-peer" getinfo 2>"$dir/peer-cli.log" | jq -e '.identity_pubkey | length == 66' >/dev/null; then ready=true; break; fi
            sleep 2
          done
          if ! "$ready"; then tail -12 "$dir/peer.log"; tail -2 "$dir/peer-cli.log"; exit 1; fi
          python3 .github/scripts/xbt-lnd-regtest-peer.py "$dir" >"$dir/fixture.log" 2>&1 &
      - name: Test the embedded engine on iPhone Simulator
        env:
          REGTEST_TIER: ${{ matrix.tier }}
        run: |
          set -eo pipefail
          bundle exec ruby .github/scripts/xbt-lnd-regtest-host.rb "$RUNNER_TEMP/xbt-host"
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project "$RUNNER_TEMP/xbt-host/RegtestHost.xcodeproj" -scheme RegtestHost -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO -skip-testing:RegtestHostTests/RegtestTests/testRestoresIdentityFromPortableFile test
          xcrun simctl bootstatus "$device" -b
          src=$(xcrun simctl get_app_container "$device" org.redwallet.sandbox.RegtestHost data)
          rebuilt="$RUNNER_TEMP/xbt-restore"
          mkdir -p "$rebuilt"
          cp "$src/Documents/RestoreFixture.rwln" "$src/Documents/RestoreIdentity.txt" "$rebuilt/"
          REGTEST_RESTORE=1 bundle exec ruby .github/scripts/xbt-lnd-regtest-host.rb "$rebuilt"
          xcodebuild -project "$rebuilt/RegtestHost.xcodeproj" -scheme RegtestHost -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO -only-testing:RegtestHostTests/RegtestTests/testRestoresIdentityFromPortableFile test


  public-sync:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
      - name: Sync a disposable public XBT node without funding it
        env:
          XBT_PUBLIC_SMOKE: "1"
        run: |
          set -eo pipefail
          bundle exec ruby .github/scripts/xbt-lnd-regtest-host.rb "$RUNNER_TEMP/xbt-public-host"
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project "$RUNNER_TEMP/xbt-public-host/RegtestHost.xcodeproj" -scheme RegtestHost -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO -only-testing:RegtestHostTests/MainnetSmokeTests test
