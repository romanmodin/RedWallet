name: Tests e2e Android

on: [pull_request]

permissions:
  contents: read

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 90
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Verify source commit
      shell: bash
      env:
        EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        actual_source="$(git rev-parse HEAD)"
        if [[ ! "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] || [[ "$actual_source" != "$EXPECTED_SOURCE" ]]; then
          echo "::error::Checkout $actual_source does not match expected source $EXPECTED_SOURCE"
          exit 1
        fi
        echo "Verified source checkout: $actual_source"
        echo "Source commit: $actual_source" >> "$GITHUB_STEP_SUMMARY"

    - name: Free disk space (Ubuntu)
      run: |
        echo "Disk before cleanup:" && df -h
        sudo rm -rf /usr/share/dotnet /opt/ghc
        sudo apt-get clean
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /usr/local/share/boost || true
        sudo rm -rf /usr/local/lib/android/sdk/ndk || true
        sudo docker system prune -af || true
        sudo rm -rf /usr/local/lib/android/sdk/system-images || true
        sudo rm -rf /usr/local/lib/android/sdk/emulator || true
        rm -rf ~/.gradle/caches/modules-2/files-2.1 || true
        rm -rf ~/.gradle/caches/build-cache || true
        rm -rf ~/.npm/_cacache ~/.cache || true
        sudo rm -rf /home/runner/work/_temp || true
        echo "Disk after cleanup:" && df -h

    - name: Specify node version
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
        cache: 'npm'

    - name: Use gradle caches
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/**/*.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install node_modules
      run: npm ci || npm ci

    - name: Use specific Java version for sdkmanager to work
      uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build
      run: npm run e2e:release-build || npm run e2e:release-build

    - name: Package APKs
      run: |
        git rev-parse HEAD > android-e2e-source.sha
        sha256sum \
          android/app/build/outputs/apk/release/app-release.apk \
          android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk > android-e2e-apks.sha256
        tar -czf bluewallet-android-apks.tar.gz \
          android-e2e-source.sha android-e2e-apks.sha256 \
          android/app/build/outputs/apk/release/app-release.apk \
          android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk

    - name: Upload APKs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: bluewallet-android-apks
        path: bluewallet-android-apks.tar.gz
        retention-days: 3
        compression-level: 0
        if-no-files-found: error

  test:
    timeout-minutes: 100
    runs-on: ubuntu-24.04
    needs: build

    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Verify source commit
      shell: bash
      env:
        EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        actual_source="$(git rev-parse HEAD)"
        if [[ ! "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] || [[ "$actual_source" != "$EXPECTED_SOURCE" ]]; then
          echo "::error::Checkout $actual_source does not match expected source $EXPECTED_SOURCE"
          exit 1
        fi
        echo "Verified source checkout: $actual_source"
        echo "Source commit: $actual_source" >> "$GITHUB_STEP_SUMMARY"

    - name: Free disk space (Ubuntu)
      run: |
        echo "Disk before cleanup:" && df -h
        sudo rm -rf /usr/share/dotnet /opt/ghc
        sudo apt-get clean
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /usr/local/share/boost || true
        sudo rm -rf /usr/local/lib/android/sdk/ndk || true
        sudo docker system prune -af || true
        rm -rf ~/.npm/_cacache ~/.cache || true
        sudo rm -rf /home/runner/work/_temp || true
        echo "Disk after cleanup:" && df -h

    - name: Ensure artifacts directory
      run: mkdir -p ${{ github.workspace }}/artifacts

    - name: Specify node version
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
        cache: 'npm'

    - name: Install node_modules
      run: npm ci || npm ci

    - name: Use specific Java version for sdkmanager to work
      uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Download APKs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: bluewallet-android-apks

    - name: Restore APKs
      run: tar -xzf bluewallet-android-apks.tar.gz

    - name: Verify APK artifact source and contents
      shell: bash
      env:
        EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        artifact_source="$(cat android-e2e-source.sha)"
        if [[ ! "$artifact_source" =~ ^[0-9a-f]{40}$ ]] || [[ "$artifact_source" != "$EXPECTED_SOURCE" ]]; then
          echo "::error::APK artifact source $artifact_source does not match expected source $EXPECTED_SOURCE"
          exit 1
        fi
        sha256sum --check --strict android-e2e-apks.sha256
        echo "APK artifact source and checksums verified: $artifact_source" >> "$GITHUB_STEP_SUMMARY"

    - name: Stage the Android test runner from the workflow commit
      shell: bash
      run: |
        # The workflow can be newer than the app checkout on a pull request.
        if [[ ! "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::Invalid workflow commit"
          exit 1
        fi
        if ! git cat-file -e "$GITHUB_WORKFLOW_SHA^{commit}" 2>/dev/null; then
          git fetch --no-tags --depth=1 origin "$GITHUB_WORKFLOW_SHA"
        fi
        git show "$GITHUB_WORKFLOW_SHA:.github/scripts/run-android-e2e.sh" > "$RUNNER_TEMP/run-android-e2e.sh"
        echo "Android test runner from workflow commit $GITHUB_WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"

    - name: Run tests
      timeout-minutes: 65
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: 36
        profile: pixel
        avd-name: Pixel_API_29_AOSP
        force-avd-creation: true
        enable-hw-keyboard: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -partition-size 2047
        arch: x86_64
        # Authenticate native TLS first, then preserve settings, encryption, scan, deletion, watch-only import and XBT recovery coverage.
        # bluewallet2 depends on a funded Bitcoin fixture; unsupported cases in bluewallet.spec are explicit skips.
        # Successful run 44005503201 completed the entire test job in 28 minutes.
        # Bound each suite separately; timeout/forced termination must remain a failure.
        script: bash "$RUNNER_TEMP/run-android-e2e.sh" "$GITHUB_WORKSPACE/artifacts"

    - name: Stop remaining emulator services
      if: always()
      timeout-minutes: 2
      shell: bash
      run: |
        # Covers an action-level timeout; normal exit is cleaned up by emulator-runner.
        if command -v adb >/dev/null 2>&1; then
          timeout --signal=TERM --kill-after=5s 15s adb emu kill || true
          timeout --signal=TERM --kill-after=5s 10s adb kill-server || true
        fi

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: failure() || cancelled()
      with:
        name: e2e-android-videos
        path: ${{ github.workspace }}/artifacts
