name: Capture signed Android beta screenshots
on: [pull_request]
permissions:
  contents: read
jobs:
  screenshots:
    if: github.head_ref == 'test/android-beta-screenshots-20261003'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Download and verify the published signed APK
        run: |
          curl --fail --location --retry 2 --output signed-beta.apk https://github.com/romanmodin/RedWallet/releases/download/android-v8.0.1-beta-1791019127/RedWallet-8.0.1-android-beta-1791019127.apk
          echo 'e966c2f9594f9e1894c48bf6857fe4df07f51dc04cb83bc53c9db77ed11f438c  signed-beta.apk' | sha256sum --check
          sdkmanager 'build-tools;36.0.0'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs signed-beta.apk > apk-signature.txt
          python3 -c "from pathlib import Path; assert 'Signer #1 certificate SHA-256 digest: 7843791c3cf340458fbf400a204361a0a97ac9c2902ae36c4511396f1f55884f' in Path('apk-signature.txt').read_text()"
      - name: Capture actual Android app views
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell cmd uimode night yes
            adb install signed-beta.apk
            adb shell pm grant com.romanmodin.redwallet android.permission.POST_NOTIFICATIONS
            python3 .github/scripts/capture-android-beta-screenshots.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: signed-android-beta-screenshots
          path: promo-screenshots/
          if-no-files-found: error
