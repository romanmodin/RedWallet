name: RedWallet Web

on:
  push:
    paths:
      - 'web/redwallet/**'
      - '.github/workflows/redwallet-web.yml'
  pull_request:
    paths:
      - 'web/redwallet/**'
      - '.github/workflows/redwallet-web.yml'

permissions:
  contents: read

concurrency:
  group: redwallet-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/redwallet
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Node24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Pinned pnpm
        run: npm install --global pnpm@10.14.0 --ignore-scripts
      - name: Locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and lint
        run: |
          pnpm --dir src/frontend typecheck
          pnpm --dir src/frontend check
      - name: Frontend tests
        run: pnpm --dir src/frontend test
      - name: Frontend build
        run: pnpm --dir src/frontend build
      - name: Bridge typecheck and tests
        run: |
          pnpm --dir src/bridge typecheck
          pnpm --dir src/bridge test
      - name: Bridge build
        run: pnpm --dir src/bridge build
