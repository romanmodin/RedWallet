name: Native BIP84 RBF Android

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bip84-rbf-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/bip84-authenticated-replacement-20261013'
    timeout-minutes: 60
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Free disk space (Ubuntu)
        run: |
          echo "Disk before cleanup:" && df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo docker system prune -af || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          rm -rf ~/.gradle/caches/modules-2/files-2.1 || true
          rm -rf ~/.gradle/caches/build-cache || true
          rm -rf ~/.npm/_cacache ~/.cache || true
          sudo rm -rf /home/runner/work/_temp || true
          echo "Disk after cleanup:" && df -h

      - name: Specify node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Use gradle caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/**/*.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install node_modules
        run: npm ci || npm ci

      - name: Use specific Java version for sdkmanager to work
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build
        run: npm run e2e:release-build || npm run e2e:release-build

      - name: Package APKs
        run: |
          tar -czf bluewallet-android-apks.tar.gz \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bluewallet-android-apks
          path: bluewallet-android-apks.tar.gz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  test:
    name: Native android (${{ matrix.stage }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        stage: [rbf]
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Free disk space (Ubuntu)
        run: |
          echo "Disk before cleanup:" && df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo docker system prune -af || true
          rm -rf ~/.npm/_cacache ~/.cache || true
          sudo rm -rf /home/runner/work/_temp || true
          echo "Disk after cleanup:" && df -h


      - name: Ensure artifacts directory
        run: mkdir -p ${{ github.workspace }}/artifacts

      - name: Specify node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install node_modules
        run: npm ci || npm ci

      - name: Use specific Java version for sdkmanager to work
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bluewallet-android-apks

      - name: Restore APKs
        run: tar -xzf bluewallet-android-apks.tar.gz

      - name: Prepare isolated backend
        run: node .github/scripts/prepare-native-backend.ts "$RUNNER_TEMP/redwallet-backend-bin"

      - name: Verify funded software path through real Fulcrum
        env:
          REDWALLET_LIVE_LIFECYCLE: '1'
        run: REDWALLET_BACKEND_BIN="$RUNNER_TEMP/redwallet-backend-bin" npx jest --runInBand tests/integration/xbt-bip84-fulcrum-live.test.ts

      - name: Run native stage ${{ matrix.stage }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          REDWALLET_NATIVE_LIVE: '1'
          REDWALLET_NATIVE_FORMAT: segwit
          REDWALLET_NATIVE_STAGE: ${{ matrix.stage }}
        with:
          api-level: 36
          profile: pixel
          avd-name: Pixel_API_29_AOSP
          force-avd-creation: true
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -partition-size 2047
          arch: x86_64
          script: bash .github/scripts/run-native-android-stage.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-lifecycle-android-${{ matrix.stage }}-evidence
          path: artifacts/native-lifecycle
