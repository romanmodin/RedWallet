name: Upload verified iMessage screenshots
"on":
  pull_request:
    paths:
      - ".github/scripts/upload-imessage-screenshots.mjs"
      - ".github/scripts/test-upload-imessage-screenshots.mjs"
      - ".github/workflows/upload-ios-imessage-screenshots.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: redwallet-imessage-upload
  cancel-in-progress: false
env:
  SOURCE_COMMIT: 9f627fb87b4b6cc28cddcf6ad45e2edc721551a8
  CI_RUN_ID: "39297579896"
  IOS_RUN_ID: "39297579842"
  FUNDED_IOS_RUN_ID: "39297639315"
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: node --test .github/scripts/test-upload-imessage-screenshots.mjs
  upload:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    environment: ios-upload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Verify exact-source release gates and unchanged extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I .github/scripts/verify-ios-release-gates.py
          git diff --exit-code 0e36e37ad797b13b711d2606b52ac70ea52e873f "$SOURCE_COMMIT" -- ios/Stickers ios/BlueWallet.xcodeproj
      - name: Download only the visually approved captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess,json,hashlib,zipfile,io
          from pathlib import Path
          repo='romanmodin/RedWallet'
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}']))
          run=api('actions/runs/39319942381')
          assert run['head_sha']=='8dcf0afc23afa997031aab0fa78b63e6fc312248'
          assert run['path']=='.github/workflows/capture-ios-imessage-screenshots.yml'
          assert run['repository']['full_name']==repo and run['head_repository']['full_name']==repo
          assert run['run_attempt']==1 and run['status']=='completed' and run['conclusion']=='success'
          images=[
            (12223530880,'3a90681cecac1fcebb817dc835310950b64066ba90f94d45588935de5164a367','attachments/A9E7D90C-EAB4-4552-9656-F25B937F1022.png','iphone.png','75b55afb7a12efc7f1867e49a4fed598c6ccdffeab646e8aa0d1a693ee038c94'),
            (12222031804,'43e68c71aa2831f951f8cabfadeff73e6128bc629ff8c50775850ac125e932e2','attachments/7445E927-EB69-4DF0-B9BF-62011B8BB801.png','ipad.png','caeee68897099b0902bef1547b0ca0acf2445439c3a1037e3ca843247211dc37')]
          root=Path('verified-imessage');root.mkdir()
          for aid,archive_hash,name,target,image_hash in images:
            meta=api(f'actions/artifacts/{aid}')
            assert not meta['expired'] and meta['workflow_run']['id']==39319942381 and meta['digest']=='sha256:'+archive_hash
            data=subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{aid}/zip'])
            assert hashlib.sha256(data).hexdigest()==archive_hash
            with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert archive.namelist().count(name)==1
              provenance=json.loads(archive.read('provenance.json'))
              assert provenance['sourceCommit']=='9f627fb87b4b6cc28cddcf6ad45e2edc721551a8'
              assert provenance['simulatorArtifactRun']=='39297579842' and provenance['freshSimulator'] and not provenance['messagesSent']
              assert any(e['bundleId']=='com.romanmodin.redwallet.Stickers' for e in provenance['extensions'])
              image=archive.read(name)
            assert hashlib.sha256(image).hexdigest()==image_hash
            (root/target).write_bytes(image)
          PY
      - name: Upload the two approved iMessage screenshots
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: node .github/scripts/upload-imessage-screenshots.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: imessage-upload-receipt
          path: imessage-upload-receipt.json
          if-no-files-found: ignore
          retention-days: 7
