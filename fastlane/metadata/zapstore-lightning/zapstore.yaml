description: |
  RedWallet Lightning is an early Android beta for the live XBT/BLAKE2b network.
  It runs an embedded LND node on your phone and uses built-in public XBT peers
  or your own compact-filter peer. Your home node is optional.
  Create invoice QR codes, tap to view invoice text, and copy or share the full invoice.
  View active and pending channel counts, payment history, and node activity.
  Manage channels, review payments and on-chain withdrawals, and export encrypted recovery files.
  The funding address is retained until a deposit is detected.
  This installs as a separate RedWallet Lightning app alongside regular RedWallet.
  Automated tests cover public sync and disposable-chain payments and recovery.
  The signed APK passed QR scanning from a real emulator screenshot, QR/text switching,
  scrolling across the QR panel, and complete invoice clipboard copying.
  Physical Android phones and funded live payments remain unverified.
  Tor/.onion Lightning peers and continuous background operation are unsupported.
  Screenshots show an empty disposable emulator wallet; no funds were sent or received.
  Based on BlueWallet and the XBT Lightning fork. Thanks to their contributors and testers.
